name: smartreco-checks

# Green CI is an eligibility requirement (CLAUDE.md, PRD §11 Day 4 PM). Two gates:
# 1. every .py file under app/ scripts/ evals/ tests/ compiles (catches stray syntax errors fast);
# 2. the pytest suite passes. Both run on every push and every PR.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (critical)
        run: python -m compileall app scripts evals tests -q

      - name: Single-gateway / no-secrets sanity
        run: |
          if [ -f .env ]; then
            echo "::error::.env must not be committed"
            exit 1
          fi

      - name: Run tests
        env:
          MESH_DISABLED: "true"
          DATABASE_URL: "postgresql+asyncpg://smartreco:smartreco_local_dev@localhost:5432/smartreco"
          QDRANT_URL: "http://localhost:6333"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret"
        run: pytest -q
